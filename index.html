<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAGES | Table Reservation</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="language-switch">
        <button class="lang-btn active" onclick="setLanguage('en')">🇬🇧 English</button>
        <button class="lang-btn" onclick="setLanguage('ar')">🇸🇦 العربية</button>
    </div>

    <div class="hero-section">
        <div class="overlay"></div>
        <div class="hero-content">
            <h1 class="logo-text">PAGES<span>CAFÉ</span></h1>
            <p class="tagline" data-key="tagline">Book your table.. and enjoy the finest moments</p>
        </div>
    </div>

    <div class="container">
        <div class="booking-card">
            <h2 data-key="title">✨ Table Reservation</h2>
            
            <form id="reservationForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> <span data-key="name">Full Name</span></label>
                    <input type="text" id="customerName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-phone"></i> <span data-key="phone">Phone Number</span></label>
                    <input type="tel" id="customerPhone" placeholder="05xxxxxxxx" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-store"></i> <span data-key="branch">Select Branch</span></label>
                    <select id="branch">
                        <option value="Kafr Sousa Branch">🌿 Kafr Sousa Branch</option>
                        <option value="Al-Ghassani Branch">🏛️ Al-Ghassani Branch</option>
                        <option value="Al-Rawda Branch">🌸 Al-Rawda Branch</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-users"></i> <span data-key="people">Number of Guests</span></label>
                    <input type="number" id="peopleCount" min="1" max="12" value="2" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-calendar"></i> <span data-key="date">Date</span></label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-clock"></i> <span data-key="time">Time</span></label>
                        <select id="time">
                            <option value="09:00">09:00</option>
                            <option value="09:30">09:30</option>
                            <option value="10:00">10:00</option>
                            <option value="10:30">10:30</option>
                            <option value="11:00">11:00</option>
                            <option value="11:30">11:30</option>
                            <option value="12:00">12:00</option>
                            <option value="12:30">12:30</option>
                            <option value="13:00">13:00</option>
                            <option value="13:30">13:30</option>
                            <option value="14:00">14:00</option>
                            <option value="14:30">14:30</option>
                            <option value="15:00">15:00</option>
                            <option value="15:30">15:30</option>
                            <option value="16:00">16:00</option>
                            <option value="16:30">16:30</option>
                            <option value="17:00">17:00</option>
                            <option value="17:30">17:30</option>
                            <option value="18:00">18:00</option>
                            <option value="18:30">18:30</option>
                            <option value="19:00">19:00</option>
                            <option value="19:30">19:30</option>
                            <option value="20:00">20:00</option>
                            <option value="20:30">20:30</option>
                            <option value="21:00">21:00</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-comment"></i> <span data-key="notes">Additional Notes</span></label>
                    <textarea id="notes" rows="3" placeholder="Any special requests?"></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fas fa-gem"></i> <span data-key="submit">Book Now</span>
                </button>
            </form>

            <div id="message"></div>
        </div>
    </div>

    <footer>
        <p>© 2024 PAGES Café | <span data-key="hours">Working Hours: 9 AM - 9 PM</span></p>
    </footer>

    <!-- النموذج المخفي لإرسال الإيميل -->
    <form id="hiddenEmailForm" style="display:none;" method="POST">
        <input type="text" name="name" id="hiddenName">
        <input type="text" name="phone" id="hiddenPhone">
        <input type="text" name="branch" id="hiddenBranch">
        <input type="text" name="people" id="hiddenPeople">
        <input type="text" name="date" id="hiddenDate">
        <input type="text" name="time" id="hiddenTime">
        <input type="text" name="notes" id="hiddenNotes">
        <input type="text" name="id" id="hiddenId">
        <input type="hidden" name="_subject" value="🫅 New Booking at PAGES Café!">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">
    </form>

    <script src="lang.js"></script>
    <script src="script.js"></script>
</body>
</html>

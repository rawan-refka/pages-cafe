<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PAGES Café</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #d4af37;
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #2c2418;
            border: 1px solid #d4af37;
            border-radius: 15px;
            padding: 20px 40px;
            text-align: center;
        }
        .stat-card h3 {
            color: #d4af37;
            font-size: 36px;
        }
        .stat-card p {
            color: #f5e6d3;
        }
        .button-group {
            text-align: center;
            margin-bottom: 30px;
        }
        .btn-excel, .btn-delete-all, .btn-refresh {
            background: #d4af37;
            color: #1a1a1a;
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .btn-delete-all {
            background: #dc3545;
            color: white;
        }
        .btn-refresh {
            background: #28a745;
            color: white;
        }
        .reservation-card {
            background: #2c2418;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            position: relative;
        }
        .reservation-card h3 {
            color: #d4af37;
            margin-bottom: 10px;
        }
        .reservation-card p {
            margin: 8px 0;
            color: #f5e6d3;
        }
        .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .no-reservations {
            text-align: center;
            color: #d4af37;
            padding: 50px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👑 PAGES Café Dashboard</h1>
        
        <div class="stats">
            <div class="stat-card">
                <h3 id="totalCount">0</h3>
                <p>Total Reservations</p>
            </div>
            <div class="stat-card">
                <h3 id="todayCount">0</h3>
                <p>Today's Reservations</p>
            </div>
        </div>

        <div class="button-group">
            <button onclick="exportToExcel()" class="btn-excel">📥 Export to Excel</button>
            <button onclick="deleteAllReservations()" class="btn-delete-all">🗑️ Delete All</button>
            <button onclick="refreshDashboard()" class="btn-refresh">🔄 Refresh</button>
        </div>

        <div id="reservationsList"></div>
    </div>

    <script src="script.js"></script>
    <script>
        function updateStats() {
            const reservations = getReservations();
            const today = new Date().toISOString().split('T')[0];
            const todayReservations = reservations.filter(r => r.date === today);
            document.getElementById('totalCount').innerText = reservations.length;
            document.getElementById('todayCount').innerText = todayReservations.length;
        }
        
        function refreshDashboard() {
            loadReservationsForDashboard();
            updateStats();
            console.log('🔄 تم تحديث لوحة التحكم');
        }
        
        // تحديث كل 5 ثواني
        refreshDashboard();
        setInterval(refreshDashboard, 5000);
    </script>
</body>
</html>
